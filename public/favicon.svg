<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background -->
  <rect width="128" height="128" fill="#fefcff" rx="32"/>

  <!-- Globe -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#7c5cbf" stroke-width="3"/>
  <ellipse cx="64" cy="64" rx="48" ry="12" fill="none" stroke="#7c5cbf" stroke-width="2.5" opacity="0.6"/>

  <!-- Meridian lines -->
  <path d="M 64 16 Q 72 40 72 64 Q 72 88 64 112" fill="none" stroke="#7c5cbf" stroke-width="2" opacity="0.5"/>
  <path d="M 64 16 Q 56 40 56 64 Q 56 88 64 112" fill="none" stroke="#7c5cbf" stroke-width="2" opacity="0.5"/>

  <!-- Clock -->
  <circle cx="64" cy="64" r="42" fill="#b49ee8" opacity="0.3"/>
  <circle cx="64" cy="64" r="40" fill="white" stroke="#7c5cbf" stroke-width="3"/>

  <!-- Clock numbers (simplified as dots) -->
  <circle cx="64" cy="28" r="2.5" fill="#7c5cbf"/>
  <circle cx="92" cy="64" r="2.5" fill="#7c5cbf"/>
  <circle cx="64" cy="100" r="2.5" fill="#7c5cbf"/>
  <circle cx="36" cy="64" r="2.5" fill="#7c5cbf"/>

  <!-- Hour hand -->
  <line x1="64" y1="64" x2="64" y2="48" stroke="#7c5cbf" stroke-width="3" stroke-linecap="round"/>

  <!-- Minute hand -->
  <line x1="64" y1="64" x2="80" y2="64" stroke="#b49ee8" stroke-width="2" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="64" cy="64" r="3" fill="#7c5cbf"/>

  <!-- Time zone indicator lines -->
  <path d="M 32 64 L 50 60" stroke="#b49ee8" stroke-width="1.5" opacity="0.6"/>
  <path d="M 96 64 L 78 68" stroke="#b49ee8" stroke-width="1.5" opacity="0.6"/>
</svg>
